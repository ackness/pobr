[package]
name = "pobr-gamedata"
version = "0.0.29"
edition.workspace = true

[dependencies]
pobr-data.workspace = true
serde.workspace = true
# Game data floats must parse to the nearest f64. Without `float_roundtrip`,
# serde_json can land one ULP away: `normal_enemy_dps_mult` (text
# 0.22727272727272727, i.e. 1.0 / 4.40) parsed as 0.2272727272727273. Builds
# without pobr-build, which also enables it, would then see different data.
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2 = { version = "0.11", default-features = false }

[features]
# Test-only snapshot pins (`test_pins::assert_pin`, with opt-in write-back).
# Off by default so the CLI and WASM builds carry no test helpers; downstream
# crates enable it from their dev-dependencies.
test-pins = []

[dev-dependencies]
# Test-only: hand-written MinionDef fixtures compared against the loaded minions.
pobr-data = { workspace = true, features = ["test-fixtures"] }
# 仅测试用：load_jewel_radii 逐值对照 pobr-tree 现有 Rust 准源常量（搬迁不变式）。
pobr-tree.workspace = true
# 仅测试用：load_base_player_mods 逐值对照 pobr-core 现有 Rust 准源（搬迁不变式）。
pobr-core.workspace = true
