[package]
name = "pobr-data"
version = "0.0.29"
edition.workspace = true

[features]
# Enables thread-local query observation for cross-crate calculation regressions.
runtime-constant-query-probe = []

[dependencies]
serde.workspace = true
# Opaque physical source columns/diagnostics are retained as data, never validity or policy.
serde_json.workspace = true
