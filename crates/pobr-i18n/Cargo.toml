[package]
name = "pobr-i18n"
version = "0.0.29"
edition.workspace = true

[dependencies]
pobr-data.workspace = true
serde.workspace = true
thiserror = "2"

[build-dependencies]
# Locale files are fixed build inputs; no TOML parser is needed at runtime.
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
