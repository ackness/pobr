# en-US stat display names. Keys are stable `StatId` strings used internally
# by the calc engine. `Translator::stat_text` looks these up directly.

[stat]
life = "Life"
mana = "Mana"
energy_shield = "Energy Shield"
spirit = "Spirit"

strength = "Strength"
dexterity = "Dexterity"
intelligence = "Intelligence"

armour = "Armour"
evasion = "Evasion Rating"
block_chance = "Block Chance"

fire_resistance = "Fire Resistance"
cold_resistance = "Cold Resistance"
lightning_resistance = "Lightning Resistance"
chaos_resistance = "Chaos Resistance"

critical_strike_chance = "Critical Strike Chance"
critical_strike_multiplier = "Critical Strike Multiplier"
accuracy = "Accuracy"
attack_speed = "Attack Speed"
cast_speed = "Cast Speed"

physical_damage = "Physical Damage"
fire_damage = "Fire Damage"
cold_damage = "Cold Damage"
lightning_damage = "Lightning Damage"
chaos_damage = "Chaos Damage"

total_dps = "Total DPS"
movement_speed = "Movement Speed"

# Display-stat label keys. Each key corresponds to a `DisplayStatId` (PascalCase)
# from `display_catalog`. `Translator::display_stat_text` looks these up.
# Convention: `display.<DisplayStatId>` (lowercased snake_case of the Pascal ID).
[display]
# --- Offence ---
TotalDPS = "Total DPS"
TotalHitAvg = "Average Hit"
HitChance = "Hit Chance"
ActionRate = "Action Rate"
EffectiveActionRate = "Effective Action Rate"
CritChance = "Critical Strike Chance"
CritMultiplier = "Critical Strike Multiplier"
# --- DoT / Ailment ---
BleedDPS = "Bleed DPS"
IgniteDPS = "Ignite DPS"
PoisonDPS = "Poison DPS"
ShockEffect = "Shock Effect"
ChillEffect = "Chill Effect"
FreezeBuildupPct = "Freeze Buildup per Hit"
ElectrocuteBuildupPct = "Electrocute Buildup per Hit"
BleedStackedDPS = "Bleed Stacked DPS"
BleedActiveStacks = "Bleed Active Stacks"
PoisonStackedDPS = "Poison Stacked DPS"
PoisonActiveStacks = "Poison Active Stacks"
# --- Resource ---
Life = "Life"
Mana = "Mana"
EnergyShield = "Energy Shield"
LifeReserved = "Life Reserved"
LifeUnreserved = "Life Unreserved"
ManaReserved = "Mana Reserved"
