[package]
name = "pobr-build"
version = "0.0.29"
edition.workspace = true

[features]
benchmarks = []

[dependencies]
pobr-data.workspace = true
pobr-core.workspace = true
pobr-tree.workspace = true
pobr-gamedata.workspace = true
base64 = "0.23"
flate2 = "1"
quick-xml = "0.42"
thiserror.workspace = true
serde.workspace = true

[dev-dependencies]
# Test-only: hand-written MinionDef fixtures.
pobr-data = { workspace = true, features = ["test-fixtures"] }
# Tests load compiled parser rules from the repo data directory; enabled only for test builds.
pobr-core = { workspace = true, features = ["test-rules"] }
# Snapshot pins for data-count assertions; test builds only.
pobr-gamedata = { workspace = true, features = ["test-pins"] }
serde_json.workspace = true
criterion = { version = "0.8", default-features = false }

[[bench]]
name = "perform_bench"
harness = false
required-features = ["benchmarks"]

[lints]
workspace = true
