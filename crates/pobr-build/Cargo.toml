[package]
name = "pobr-build"
version.workspace = true
edition.workspace = true

[dependencies]
pobr-data.workspace = true
pobr-core.workspace = true
pobr-tree.workspace = true
pobr-item.workspace = true
pobr-gamedata.workspace = true
base64 = "0.22"
flate2 = "1"
quick-xml = "0.41"
thiserror = "2"

[dev-dependencies]
serde_json = { workspace = true }
criterion = { version = "0.8", default-features = false }
# 测试取真实 CompiledParserRules（读仓库数据目录）；仅测试构建启用。
pobr-core = { workspace = true, features = ["test-rules"] }

[[bench]]
name = "perform_bench"
harness = false
