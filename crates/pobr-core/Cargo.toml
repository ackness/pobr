[package]
name = "pobr-core"
version.workspace = true
edition.workspace = true

[dependencies]
pobr-data.workspace = true

[features]
# M3 T3 双计防护（蓝图 §6.1）：buff_pass 的 Aura kind 消费开关。默认关 = Aura 空转
# （编排层 aura_buff_modifiers 旧静态直注照旧）；开（测试/C5 双跑用）= aura 乘区路径
# 可消费 BuffSpec（仍需 cfg.mode_buffs）。C5 切换（关静态直注 + 置 mode_buffs）收尾后
# 删 flag、删旧码。
buff-pass-aura = []

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
# 仅测试侧反序列化 statmap 条目 fixture（lib 本体维持零 I/O / 零 serde_json）。
serde_json.workspace = true

[[bench]]
name = "mod_db_bench"
harness = false

