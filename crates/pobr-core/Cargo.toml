[package]
name = "pobr-core"
version.workspace = true
edition.workspace = true

[features]
# M6-B 数据驱动 parser 引擎（默认 off，新旧并存——本 track 不切换调用方）。
# 开启编译 mod_parser::{scan,compiled,forms,template,engine,canonical} 与
# aho-corasick 依赖。切换（删 legacy）是 D-T8 的独立 commit。
parser-engine = ["dep:aho-corasick"]

[dependencies]
pobr-data.workspace = true
# special 词条模板的整行锚定匹配（M5b rules::special_mod，载入期编译 RegexSet）。
regex.workspace = true
# parser-engine 专用（plain 短语索引 + literal 预过滤）；feature 关时不编译。
aho-corasick = { workspace = true, optional = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
# 仅测试侧反序列化 statmap 条目 fixture（lib 本体维持零 I/O / 零 serde_json）。
serde_json.workspace = true

[[bench]]
name = "mod_db_bench"
harness = false

# M6-B parser 引擎 vs legacy 中位耗时 bench（蓝图 §9，engine ≤ 1.10× legacy）。
[[bench]]
name = "mod_parser_bench"
harness = false
required-features = ["parser-engine"]

