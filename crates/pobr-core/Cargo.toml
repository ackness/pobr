[package]
name = "pobr-core"
version = "0.0.29"
edition.workspace = true

[features]
# Gate benchmark target compilation out of ordinary tests.
benchmarks = []
# Test-only rule loader helper (`mod_parser::test_compiled_rules`) for downstream integration
# tests (separate crates) to load `CompiledParserRules` from `data/<version>/` parser/special
# rule files, pulling in serde_json + fs I/O. **Off by default**: enabling it breaks
# pobr-core's zero-I/O / no-serde_json invariant, so production builds never enable it.
test-rules = ["dep:serde_json"]

[dependencies]
serde.workspace = true
pobr-data.workspace = true
# Full-line anchored matching for special mod templates (rules::special_mod, RegexSet built on load).
regex.workspace = true
# Parses a special pattern to count its capture groups at load, without compiling it.
regex-syntax = "0.8"
# Data-driven parser engine (plain phrase index + literal prefilter) — unconditional dependency.
aho-corasick.workspace = true
# Test-rules only (deserializes rule files); omitted when the feature is off to keep zero I/O.
serde_json = { workspace = true, optional = true }

[dev-dependencies]
pobr-data = { workspace = true, features = ["runtime-constant-query-probe", "test-fixtures"] }
# Test-only deserialization for statmap entry fixtures (keeps lib zero I/O and serde_json-free).
serde_json.workspace = true
criterion = { version = "0.8", default-features = false }

[[bench]]
name = "mod_db_bench"
harness = false
required-features = ["benchmarks"]

# M6-B parser engine vs legacy median latency benchmark (target: engine <= 1.10x legacy).
[[bench]]
name = "mod_parser_bench"
harness = false
required-features = ["benchmarks"]

[lints]
workspace = true

