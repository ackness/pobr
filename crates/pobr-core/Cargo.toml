[package]
name = "pobr-core"
version.workspace = true
edition.workspace = true

[features]
# 测试专用规则加载 helper（`mod_parser::test_compiled_rules`）。仅供下游集成测试
# （独立 crate）取 `CompiledParserRules`——读仓库 `data/<version>/` 的 parser/special
# 规则文件，故引入 serde_json + fs I/O。**默认 off**：开启才破 pobr-core「本体零 I/O
# / 不依赖 serde_json」不变式，生产构建恒不启用此 feature，零 I/O 铁律不变。
test-rules = ["dep:serde_json"]

[dependencies]
pobr-data.workspace = true
# special 词条模板的整行锚定匹配（M5b rules::special_mod，载入期编译 RegexSet）。
regex.workspace = true
# 数据驱动 parser 引擎（plain 短语索引 + literal 预过滤）——无条件依赖。
aho-corasick.workspace = true
# test-rules 专用（规则文件反序列化）；feature 关时不编译，零 I/O 不变式不破。
serde_json = { workspace = true, optional = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
# 仅测试侧反序列化 statmap 条目 fixture（lib 本体维持零 I/O / 零 serde_json）。
serde_json.workspace = true

[[bench]]
name = "mod_db_bench"
harness = false

# M6-B parser 引擎 vs legacy 中位耗时 bench（蓝图 §9，engine ≤ 1.10× legacy）。
[[bench]]
name = "mod_parser_bench"
harness = false

