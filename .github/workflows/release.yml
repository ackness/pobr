name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Repeated publication of one tag is serialized, never cancelled mid-upload.
concurrency:
  group: release-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  metadata:
    name: release identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      production: ${{ steps.identity.outputs.production }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: python3 devs/scripts/release-policy.py tag "$RELEASE_TAG" "$RELEASE_SHA"

  full:
    name: release validation
    needs: metadata
    uses: ./.github/workflows/ci.yml

  release-wasm:
    name: publish standalone WASM
    needs: [metadata, full]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: policy
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: wasm-release
          path: wasm-release
      - name: Attach verified assets to version release
        working-directory: wasm-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          sha256sum --check SHA256SUMS
          python3 ../policy/devs/scripts/release-policy.py publication "$RELEASE_TAG" "$RELEASE_SHA"
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" pobr-wasm-*-web.tar.gz wasm-size.json wasm-size.md SHA256SUMS --clobber
          else
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" pobr-wasm-*-web.tar.gz wasm-size.json wasm-size.md SHA256SUMS \
              --verify-tag --generate-notes --notes-file wasm-size.md "${flags[@]}"
          fi

  deploy:
    name: deploy stable v0 to Cloudflare Pages
    needs: [metadata, full, release-wasm]
    if: needs.metadata.outputs.production == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: production-pages
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          path: policy
          persist-credentials: false
      # Recheck inside the production lock. Only the highest stable remote v0
      # tag is eligible; a newer failing tag deliberately blocks older deploys.
      - name: Reject stale or moved tag
        id: candidate
        working-directory: policy
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: python3 devs/scripts/release-policy.py deployment "$RELEASE_TAG" "$RELEASE_SHA"
      - uses: actions/download-artifact@v8
        if: steps.candidate.outputs.deploy == 'true'
        with:
          name: web-dist
          path: dist
      - uses: cloudflare/wrangler-action@v4
        if: steps.candidate.outputs.deploy == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=pobr-web --branch=master
