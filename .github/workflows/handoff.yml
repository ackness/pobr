name: PR handoff

# Body/audit edits recheck metadata without rebuilding Rust or WASM.
on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: handoff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  handoff:
    name: PR handoff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 devs/scripts/pr-handoff.py
        env:
          GH_TOKEN: ${{ github.token }}
