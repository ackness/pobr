name: PR checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

# A replacement PR run covers the cumulative PR. Master push ranges are
# incremental: give each push its own group so a docs push cannot cancel code CI.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changes:
    name: plan checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.plan.outputs.rust }}
      web: ${{ steps.plan.outputs.web }}
      scripts: ${{ steps.plan.outputs.scripts }}
      full: ${{ steps.plan.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        run: python3 devs/scripts/ci-plan.py
      - name: Validate version bump
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            python3 devs/scripts/release-policy.py bump HEAD^1
          elif git cat-file -e "$PUSH_BASE:Cargo.toml" 2>/dev/null; then
            python3 devs/scripts/release-policy.py bump "$PUSH_BASE" --allow-existing-tag
          fi

  rust:
    name: fmt + clippy + smoke + parity
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: bash devs/scripts/driver.sh smoke
      - run: cargo test -p pobr-wasm --lib typescript_contract_is_current
      - run: cargo test -p pobr-build --test parity no_regression

  web:
    name: web typecheck + unit + worker
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:worker

  scripts:
    name: automation contracts
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: taiki-e/install-action@v2
        with:
          tool: actionlint@1.7.12
      - run: bash devs/scripts/check-workflows.sh

  full:
    name: full validation
    needs: changes
    if: needs.changes.outputs.full == 'true'
    uses: ./.github/workflows/ci.yml

  gate:
    name: PR gate
    needs: [changes, rust, web, scripts, full]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require every planned check
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 devs/scripts/ci-gate.py pr
