name: Contribution checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

# A replacement PR run covers the cumulative PR. Master push ranges are
# incremental: give each push its own group so a docs push cannot cancel code CI.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changes:
    name: plan checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.plan.outputs.rust }}
      web: ${{ steps.plan.outputs.web }}
      scripts: ${{ steps.plan.outputs.scripts }}
      full: ${{ steps.plan.outputs.full }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - id: plan
        run: python3 devs/scripts/ci-plan.py
      - name: Validate version bump
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            python3 devs/scripts/release-policy.py bump HEAD^1
          elif git cat-file -e "$PUSH_BASE:Cargo.toml" 2>/dev/null; then
            python3 devs/scripts/release-policy.py bump "$PUSH_BASE" --allow-existing-tag
          fi

  rust:
    name: Rust format + check
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          rust: 'true'
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo fmt --all --check
      - run: cargo check --locked --workspace --all-targets

  web:
    name: web typecheck + unit + worker
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          node: 'true'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:worker

  scripts:
    name: automation contracts
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          node: 'true'
          scripts: 'true'
      # setup-node restores the pnpm store, not the linked node_modules tree.
      # The package contract test invokes the project's TypeScript compiler.
      - name: Install automation test dependencies
        run: pnpm --dir web install --frozen-lockfile
      - run: bash devs/scripts/check-workflows.sh

  full:
    name: master integration
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.full == 'true'
    uses: ./.github/workflows/ci.yml

  gate:
    name: PR gate
    needs: [changes, rust, web, scripts, full]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - name: Require every planned check
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 devs/scripts/ci-gate.py pr
