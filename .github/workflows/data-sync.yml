name: Latest complete data

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [owned-data-published]
  workflow_run:
    workflows: [Contribution checks, Full validation]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

# Proposal and acceptance share one writer. Source frontiers and head/base CAS
# still decide freshness; serialization alone does not establish ordering.
concurrency:
  group: latest-complete-data
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.repository == 'ackness/pobr' && (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'automation/data-latest')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # workflow_run is privileged: use only the default branch's trusted code.
      # Candidate metadata is read as fixed Git blobs by latest_sync.py.
      - uses: actions/checkout@v7.0.1
        with:
          ref: master
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          gh: 'true'
      - name: Resolve a complete proposal or accept a completed candidate
        env:
          GH_TOKEN: ${{ secrets.DATA_SYNC_TOKEN || github.token }}
          DATA_SYNC_AUTH_READY: ${{ secrets.DATA_SYNC_TOKEN != '' }}
          SYNC_ACTION: ${{ github.event_name == 'workflow_run' && 'accept' || 'propose' }}
        run: |
          mkdir -p .cache/latest-sync
          python3 pipeline/latest_sync.py "$SYNC_ACTION" --out .cache/latest-sync/result.json
      - name: Preserve freshness, gate and adoption outcome
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: latest-sync-result
          path: .cache/latest-sync/result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
