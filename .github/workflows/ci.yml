name: CI

# Gate per CLAUDE.md: fmt + clippy + test.
#
# Trigger strategy: this full gate does NOT run on every push/PR (pull requests
# get the lightweight checks in pr.yml instead). It runs only on:
#   - a pushed version tag (v0.0.1, v1.2.3, ...) — i.e. on release;
#   - a release PR: a pull request that changes the workspace version in the
#     root Cargo.toml, so gate failures surface before the tag is pushed;
#   - a manual dispatch (Actions tab "Run workflow", or `gh workflow run ci.yml`),
#     to validate a branch on demand.
# The full gate takes about 20 minutes, so it is reserved for releases and requests.
#
# Rust lint, Rust tests and Web run in parallel. Release CI owns the complete
# gate; local development only needs relevant checks, not a duplicate full run.
on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [master]
    paths:
      - Cargo.toml
  workflow_dispatch:
    inputs:
      e2e:
        description: Also run the Playwright E2E suite (about 15 minutes)
        type: boolean
        default: false

# Cancel superseded runs for the same ref (e.g. re-dispatch on the same branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # On pull requests, decides whether this is a release PR and validates its
  # version metadata. Other events always run the full gate.
  release-check:
    name: release metadata
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.release }}
    steps:
      # The default PR checkout is the merge commit; its first parent is the base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: decide
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            devs/scripts/release-check.sh HEAD^1
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: fmt + clippy
    needs: release-check
    if: needs.release-check.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Best-effort dependency cache. With tag/manual-only triggers runs are
      # infrequent, so a cache often evicts (7-day idle) before reuse — that is
      # expected; a release run starting cold is fine.
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Workflow script tests
        run: python3 devs/scripts/test_workflows.py
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  ci:
    name: Rust tests + data compatibility
    needs: release-check
    if: needs.release-check.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # luajit lets the fixture-based extract-lua tooling tests run instead of
      # self-skipping. Tests that need the gitignored vendor PoB2 checkout still
      # skip gracefully in CI by design (see CLAUDE.md "Parity 体系").
      - name: Install luajit
        run: sudo apt-get update && sudo apt-get install -y luajit lua-dkjson
      - name: Data update compatibility tests
        run: |
          python3 pipeline/test-data-update.py
          python3 pipeline/test-data-snapshot.py
      - name: Test (nextest)
        run: cargo nextest run --workspace
      # nextest does not run doctests; cover them separately.
      - name: Doctests
        run: cargo test --workspace --doc
      - name: Language catalog lint
        run: cargo run -p lint-i18n

  # Independent Web gate: script tests, typecheck, unit tests and Worker checks.
  # Then build real WASM, sync data and bundle the site once. The standalone
  # package smoke validates the compiled engine; Playwright E2E is opt-in. Release and deploy
  # wait for this job and both Rust gates to pass.
  web:
    name: web (tsc + vitest + build + package)
    needs: release-check
    if: needs.release-check.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      # pnpm version comes from web/package.json "packageManager" — the action
      # only auto-reads the repo-root package.json (which does not exist here).
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Dictionary snapshot tests
        run: node --test ../pipeline/test-dictionary-source.mjs ../pipeline/test-query-patch-version.mjs
      - name: WASM packaging tests
        run: node --test scripts/package-wasm.test.mjs scripts/sync-data.test.mjs
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck (pre-wasm placeholder tolerated via ts-ignore)
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Worker runtime smoke
        run: pnpm test:worker
      - name: Build wasm
        run: pnpm build-wasm
      - name: Sync game data
        run: pnpm sync-data
      # Typecheck already passed above; bundle without repeating tsc.
      - name: Build
        run: pnpm exec vite build
      # Hand the built site to the deploy job (path is workspace-relative,
      # unaffected by the job-level working-directory).
      - name: Upload dist for deploy
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 3
      # E2E is opt-in: it runs only for a manual dispatch with `e2e` enabled
      # (`mise run ci <ref> --e2e`), never on tags or release PRs.
      - name: Install Playwright
        if: inputs.e2e
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E smoke
        if: inputs.e2e
        run: pnpm exec playwright test
      - name: Package standalone WASM and report size
        run: |
          pnpm package-wasm
          pnpm smoke-wasm-package
          cat ../.cache/wasm-release/wasm-size.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload WASM release assets
        uses: actions/upload-artifact@v7
        with:
          name: wasm-release
          path: .cache/wasm-release/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7

  release-wasm:
    name: publish standalone WASM
    needs: [lint, ci, web]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wasm-release
          path: wasm-release
      - name: Attach WASM assets to version release
        working-directory: wasm-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum --check SHA256SUMS
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" pobr-wasm-*-web.tar.gz wasm-size.json wasm-size.md SHA256SUMS --clobber
          else
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" pobr-wasm-*-web.tar.gz wasm-size.json wasm-size.md SHA256SUMS \
              --verify-tag --generate-notes --notes-file wasm-size.md "${flags[@]}"
          fi

  # Auto-deploy to Cloudflare Pages on v0.x release tags after all gates pass.
  # Reuses the dist built by the web job —
  # no rebuild. One-time setup: create the Pages project and add the
  # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets (see PR/commit).
  deploy:
    name: deploy to Cloudflare Pages
    needs: [lint, ci, web]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v0.')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: dist
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch=master marks this as a production deployment (must match
          # the Pages project's production branch); tag checkouts are detached
          # so wrangler cannot infer it.
          command: pages deploy dist --project-name=pobr-web --branch=master
