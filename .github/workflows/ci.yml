name: Full validation

# No publication or secrets: this is shared by PRs, release tags and manual CI.
on:
  workflow_call:
    inputs:
      e2e:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      e2e:
        description: Also run the Playwright E2E suite (about 15 minutes)
        type: boolean
        default: false
  schedule:
    - cron: '0 19 * * *'

permissions:
  contents: read

concurrency:
  # Only non-default branch work is replaceable. Unique groups preserve every
  # master/tag run, including pending runs (cancel-in-progress:false alone does not).
  group: full-${{ github.workflow }}-${{ github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch }}

# The caller cancels superseded PR runs. No callee group can cancel its parent;
# master/nightly runs stay independent and nightly also retries older failures.
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          rust: 'true'
          python: 'false'
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: host-check
          cache-bin: 'false'
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --features pobr-core/benchmarks,pobr-build/benchmarks,pobr-wasm/diagnostics -- -D warnings

  ci:
    name: Rust tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # A failure must not cancel other shards: all original checks still run.
      fail-fast: false
      matrix:
        shard: [build, wasm, libraries-tools]
    env:
      LUA_PATH: '/usr/share/lua/5.1/?.lua;;'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          rust: 'true'
          python: 'true'
          oracle: ${{ matrix.shard == 'libraries-tools' && 'true' || 'false' }}
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: tests-${{ matrix.shard }}
          cache-bin: 'false'
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Install Lua JSON module
        if: matrix.shard == 'libraries-tools'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua-dkjson
      - name: Restore owner data downloads
        uses: actions/cache@v6
        with:
          # Content-addressed by SHA-256; every hit is re-verified against the lock.
          path: .cache/data-import-downloads
          key: owner-data-${{ hashFiles('pipeline/latest/data-composition.json', 'pipeline/runtime/build-data*.lock.json') }}
          restore-keys: owner-data-
      - name: Prepare pinned external data for real tests
        run: |
          python3 -m pipeline.runtime.build_data --install data
          python3 -m pipeline.runtime.build_data --lock pipeline/runtime/build-data-0.5.5.4.2.lock.json --install data --keep-current
          python3 -c 'import json; from pathlib import Path; assert Path("data/CURRENT").read_text().strip() == json.loads(Path("pipeline/runtime/build-data.lock.json").read_bytes())["target"]["game_patch"]'
          bash devs/scripts/check-data.sh
      - name: Workspace tests (including doctests)
        env:
          CI_SHARD: ${{ matrix.shard }}
        run: python3 devs/scripts/ci-rust-tests.py "$CI_SHARD"
      - name: Build ordinary domain adapter
        if: matrix.shard == 'libraries-tools'
        run: cargo build --locked -p pobr-data-adapter --bin pobr-data-adapter
      - name: Produce declared ordinary candidates from pinned Git inputs
        if: matrix.shard == 'libraries-tools'
        run: |
          python3 -m pipeline.runtime.ordinary.ordinary_inputs execute --out .cache/ci-ordinary \
            --adapter target/debug/pobr-data-adapter
      - name: Preserve ordinary runtime outputs and production evidence
        if: matrix.shard == 'libraries-tools'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ordinary-domain-candidates
          # Expanded source/CSD/verification data stay out of player artifacts.
          path: |
            .cache/ci-ordinary/completed.json
            .cache/ci-ordinary/inputs/handoff.json/handoff.json
            .cache/ci-ordinary/logs/
            .cache/ci-ordinary/*/producer-receipt.json
            .cache/ci-ordinary/*/base/
            .cache/ci-ordinary/*/overlay/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      - name: Preserve failed ordinary command logs
        if: failure() && matrix.shard == 'libraries-tools'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ordinary-domain-failure
          path: .cache/ci-ordinary/logs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
      - name: Derived rules reproducibility and parse-coverage ratchet
        if: matrix.shard == 'libraries-tools'
        run: POBR_PATCH="$(cat data/CURRENT)" bash devs/scripts/regen-check.sh
      - name: Language catalog lint
        if: matrix.shard == 'libraries-tools'
        run: cargo run --locked -p lint-i18n

  # Independent Web gate: script tests, typecheck, unit tests and Worker checks.
  # Then build real WASM, sync data and bundle the site once. The standalone
  # package smoke validates the compiled engine; Playwright E2E is opt-in. Release and deploy
  # wait for this job and both Rust gates to pass.
  web:
    name: web (tsc + vitest + build + package)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          rust: 'true'
          node: 'true'
          wasm: 'true'
          python: 'true'
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          cache-bin: 'false'
          cache-directories: ~/.cache/.wasm-pack
          save-if: ${{ github.event_name != 'pull_request' }}
      # A small, exact source/toolchain cache avoids Cargo + bindgen + wasm-opt
      # when only UI, tests or runtime data changed. The receipt is revalidated.
      - name: WASM build identity
        id: wasm-key
        run: node scripts/wasm-cache-key.mjs
      - uses: actions/cache@v6
        with:
          path: web/src/wasm/pkg
          key: wasm-bindings-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.wasm-key.outputs.key }}
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Restore owner data downloads
        uses: actions/cache@v6
        with:
          # Content-addressed by SHA-256; every hit is re-verified against the lock.
          path: .cache/data-import-downloads
          key: owner-data-${{ hashFiles('pipeline/latest/data-composition.json', 'pipeline/runtime/build-data*.lock.json') }}
          restore-keys: owner-data-
      - name: Prepare pinned external data for Web tests and build
        working-directory: .
        run: |
          python3 -m pipeline.runtime.build_data --install data
          bash devs/scripts/check-data.sh
      - name: Typecheck (pre-wasm placeholder tolerated via ts-ignore)
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Worker runtime smoke
        run: pnpm test:worker
      - name: Validate declared external data imports
        working-directory: .
        # Source/candidate verification stays in CI. The current display-only
        # import does not replace the complete adopted runtime snapshot below.
        run: python3 -m pipeline.imports.data_imports --out .cache/ci-data-imports
      - name: Preserve generated display candidate
        uses: actions/upload-artifact@v7.0.2
        with:
          name: external-display-candidate
          path: |
            .cache/ci-data-imports/runtime/display_texts.json
            .cache/ci-data-imports/runtime/receipt.json
            .cache/ci-data-imports/import-receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      - name: Build wasm
        # Binaryen's Linux release workers can exhaust their small musl stacks
        # on this module. Keep all optimization passes, but use the main thread.
        # https://github.com/WebAssembly/binaryen/issues/7570
        env:
          BINARYEN_CORES: '1'
        # Match the identity step's environment. pnpm scripts can prepend
        # invocation-specific PATH entries, invalidating a restored receipt.
        run: node scripts/build-wasm.mjs
      - name: Sync game data
        run: pnpm sync-data
      - name: Real WASM request contract
        run: pnpm test:wasm-contract
      # Typecheck already passed above; bundle without repeating tsc.
      - name: Build
        run: pnpm exec vite build
      # Hand the built site to the deploy job (path is workspace-relative,
      # unaffected by the job-level working-directory).
      - name: Upload dist for deploy
        uses: actions/upload-artifact@v7.0.2
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 3
      # E2E is opt-in: it runs only for a manual dispatch with `e2e` enabled
      # (`mise run ci <ref> --e2e`), never on tags or release PRs.
      - name: Install Playwright
        if: inputs.e2e
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E smoke
        if: inputs.e2e
        run: pnpm exec playwright test
      - name: Package standalone WASM and report size
        run: |
          pnpm package-wasm
          cat ../.cache/wasm-release/wasm-size.md >> "$GITHUB_STEP_SUMMARY"
      - name: Standalone WASM package smoke
        run: pnpm smoke-wasm-package
      - name: Upload WASM release assets
        uses: actions/upload-artifact@v7.0.2
        with:
          name: wasm-release
          path: .cache/wasm-release/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-failure
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7

  runtime:
    name: declared runtime composition
    needs: [ci, web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          node: 'true'
      - name: Restore owner data downloads
        uses: actions/cache@v6
        with:
          # Content-addressed by SHA-256; every hit is re-verified against the lock.
          path: .cache/data-import-downloads
          key: owner-data-${{ hashFiles('pipeline/latest/data-composition.json', 'pipeline/runtime/build-data*.lock.json') }}
          restore-keys: owner-data-
      - name: Verify the recorded complete publication composition
        run: |
          mkdir -p .cache
          python3 -m pipeline.latest.latest_data verify-composition > .cache/runtime-composition-verify.json
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ordinary-domain-candidates
          path: .cache/ci-ordinary
      - uses: actions/download-artifact@v8.0.2
        with:
          name: external-display-candidate
          path: .cache/ci-data-imports
      - name: Compose completed domains and verified display into three runtime blocks
        run: |
          python3 -m pipeline.runtime.runtime_pack import --imports .cache/ci-data-imports \
            --ordinary .cache/ci-ordinary --out .cache/ci-runtime-pack --require-full-alignment \
            > .cache/runtime-pack-status.json
      - uses: actions/download-artifact@v8.0.2
        with:
          name: wasm-release
          path: .cache/ci-wasm-release
      - name: Verify and materialize this run's completed runtime candidate
        id: runtime-candidate
        run: |
          python3 -m pipeline.runtime.runtime_pack verify --pack .cache/ci-runtime-pack/player \
            > .cache/runtime-candidate-verify.json
          python3 -m pipeline.runtime.runtime_pack materialize --pack .cache/ci-runtime-pack/player \
            --out .cache/ci-runtime-materialized > .cache/runtime-candidate-materialized.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          release = json.loads(Path('.cache/ci-runtime-pack/player/manifest.json').read_text())
          print('runtime=' + release['runtime_identity'])
          PY
      - name: Consume this runtime candidate with the same run's standalone WASM
        env:
          EXPECTED_RUNTIME: ${{ steps.runtime-candidate.outputs.runtime }}
        run: |
          node web/scripts/smoke-runtime-candidate.mjs \
            --package .cache/ci-wasm-release --data .cache/ci-runtime-materialized \
            --expected-runtime "$EXPECTED_RUNTIME" --out .cache/runtime-candidate-smoke.json
      - name: Preserve runtime candidate and build evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: runtime-pack-candidate
          path: |
            .cache/runtime-pack-status.json
            .cache/runtime-composition-verify.json
            .cache/ci-runtime-pack/
            .cache/runtime-candidate-verify.json
            .cache/runtime-candidate-materialized.json
            .cache/runtime-candidate-smoke.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  scripts:
    name: automation contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          node: 'true'
          scripts: 'true'
      # Populate node_modules even when the pnpm store cache is an exact hit.
      - name: Install automation test dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Restore owner data downloads
        uses: actions/cache@v6
        with:
          # Content-addressed by SHA-256; every hit is re-verified against the lock.
          path: .cache/data-import-downloads
          key: owner-data-${{ hashFiles('pipeline/latest/data-composition.json', 'pipeline/runtime/build-data*.lock.json') }}
          restore-keys: owner-data-
      - name: Prepare pinned external data for automation integration tests
        run: |
          python3 -m pipeline.runtime.build_data --install data
          bash devs/scripts/check-data.sh
      - run: bash devs/scripts/check-workflows.sh

  gate:
    name: Full gate
    needs: [lint, ci, web, runtime, scripts]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            devs/scripts/ci-gate.py
            devs/scripts/ci-plan.py
          sparse-checkout-cone-mode: false
      - name: Require every full check
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 devs/scripts/ci-gate.py full
