name: Full validation

# No publication or secrets: this is shared by PRs, release tags and manual CI.
on:
  workflow_call:
    inputs:
      e2e:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      e2e:
        description: Also run the Playwright E2E suite (about 15 minutes)
        type: boolean
        default: false
  schedule:
    - cron: '0 19 * * *'

permissions:
  contents: read

# The caller cancels superseded PR runs. No callee group can cancel its parent;
# manual/nightly runs stay independent and nightly also retries older failures.
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          rust: 'true'
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --features pobr-core/benchmarks,pobr-build/benchmarks,pobr-wasm/diagnostics -- -D warnings

  ci:
    name: Rust tests + data compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LUA_PATH: '/usr/share/lua/5.1/?.lua;;'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          rust: 'true'
          oracle: 'true'
      - uses: Swatinem/rust-cache@v2.9.3
      # luajit lets the fixture-based extract-lua tooling tests run instead of
      # self-skipping. Tests that need the gitignored vendor PoB2 checkout still
      # skip gracefully in CI by design (see docs/maintainer-guide.md "Parity 体系").
      - name: Install luajit
        run: sudo apt-get update && sudo apt-get install -y lua-dkjson
      - name: Data update compatibility (including Lua extraction)
        run: python3 pipeline/test-data-update.py
      # libtest shares immutable fixtures within each suite and includes doctests.
      - name: Workspace tests (including doctests)
        run: cargo test --workspace --locked
      # Compare fresh parser payloads with committed generated artifacts, not
      # only coverage totals. Missing raw export inputs remain explicit skips.
      - name: Generated data reproducibility
        run: POBR_PATCH="$(cat data/CURRENT)" bash devs/scripts/regen-check.sh
      - name: Language catalog lint
        run: cargo run -p lint-i18n

  # Independent Web gate: script tests, typecheck, unit tests and Worker checks.
  # Then build real WASM, sync data and bundle the site once. The standalone
  # package smoke validates the compiled engine; Playwright E2E is opt-in. Release and deploy
  # wait for this job and both Rust gates to pass.
  web:
    name: web (tsc + vitest + build + package)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          rust: 'true'
          node: 'true'
          wasm: 'true'
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck (pre-wasm placeholder tolerated via ts-ignore)
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Worker runtime smoke
        run: pnpm test:worker
      - name: Build wasm
        # Binaryen's Linux release workers can exhaust their small musl stacks
        # on this module. Keep all optimization passes, but use the main thread.
        # https://github.com/WebAssembly/binaryen/issues/7570
        env:
          BINARYEN_CORES: '1'
        run: pnpm build-wasm
      - name: Sync game data
        run: pnpm sync-data
      - name: Real WASM request contract
        run: pnpm test:wasm-contract
      # Typecheck already passed above; bundle without repeating tsc.
      - name: Build
        run: pnpm exec vite build
      # Hand the built site to the deploy job (path is workspace-relative,
      # unaffected by the job-level working-directory).
      - name: Upload dist for deploy
        uses: actions/upload-artifact@v7.0.2
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 3
      # E2E is opt-in: it runs only for a manual dispatch with `e2e` enabled
      # (`mise run ci <ref> --e2e`), never on tags or release PRs.
      - name: Install Playwright
        if: inputs.e2e
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E smoke
        if: inputs.e2e
        run: pnpm exec playwright test
      - name: Package standalone WASM and report size
        run: |
          pnpm package-wasm
          pnpm smoke-wasm-package
          cat ../.cache/wasm-release/wasm-size.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload WASM release assets
        uses: actions/upload-artifact@v7.0.2
        with:
          name: wasm-release
          path: .cache/wasm-release/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-failure
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7

  scripts:
    name: automation contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          node: 'true'
          scripts: 'true'
      # Populate node_modules even when the pnpm store cache is an exact hit.
      - name: Install automation test dependencies
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir pipeline install --frozen-lockfile
      - run: bash devs/scripts/check-workflows.sh
      - name: Data exporter contract
        run: node --test pipeline/test-exporter.mjs

  gate:
    name: Full gate
    needs: [lint, ci, web, scripts]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - name: Require every full check
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 devs/scripts/ci-gate.py full
