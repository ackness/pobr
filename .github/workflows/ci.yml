name: CI

# Gate per CLAUDE.md: fmt + clippy + test.
#
# Trigger strategy (cost-optimized for a private repo): CI does NOT run on every
# push/PR. It runs only on:
#   - a pushed version tag (v0.0.1, v1.2.3, ...) — i.e. on release;
#   - a manual dispatch (Actions tab "Run workflow", or `gh workflow run ci.yml`),
#     to validate a branch on demand.
# Day-to-day commits cost nothing; you pay only when releasing or when you ask.
#
# Single sequential job: GitHub bills per job rounded up to the minute, so one
# job = one rounding. Cheapest checks run first, so a fmt/clippy failure exits
# before the ~4-min test compile.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Cancel superseded runs for the same ref (e.g. re-dispatch on the same branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Best-effort dependency cache. With tag/manual-only triggers runs are
      # infrequent, so a cache often evicts (7-day idle) before reuse — that is
      # expected; a release run starting cold is fine.
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # Cheapest first — fail fast before the expensive test compile.
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # luajit lets the fixture-based extract-lua tooling tests run instead of
      # self-skipping. Tests that need the gitignored vendor PoB2 checkout still
      # skip gracefully in CI by design (see CLAUDE.md "Parity 体系"). Installed
      # after clippy so a lint failure skips it too.
      - name: Install luajit
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Test (nextest)
        run: cargo nextest run --workspace
      # nextest does not run doctests; cover them separately.
      - name: Doctests
        run: cargo test --workspace --doc

  # Web frontend gate (TODO.md 6.4): independent job so it never blocks the
  # Rust gate above. Builds the real wasm artifact (validates the wasm32
  # compile of the whole pobr-build chain), then typecheck + unit + build +
  # Playwright smoke against the built dist.
  web:
    name: web (tsc + vitest + build + e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      # pnpm version comes from web/package.json "packageManager" — the action
      # only auto-reads the repo-root package.json (which does not exist here).
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck (pre-wasm placeholder tolerated via ts-ignore)
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build wasm
        run: pnpm build-wasm
      - name: Sync game data
        run: pnpm sync-data
      - name: Build
        run: pnpm build
      # Hand the built site to the deploy job (path is workspace-relative,
      # unaffected by the job-level working-directory).
      - name: Upload dist for deploy
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 3
      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E smoke
        run: pnpm exec playwright test

  # Auto-deploy to Cloudflare Pages on v0.x release tags, only after BOTH the
  # Rust gate and the web gate pass. Reuses the dist built by the web job —
  # no rebuild. One-time setup: create the Pages project and add the
  # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets (see PR/commit).
  deploy:
    name: deploy to Cloudflare Pages
    needs: [ci, web]
    if: startsWith(github.ref, 'refs/tags/v0.')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch=master marks this as a production deployment (must match
          # the Pages project's production branch); tag checkouts are detached
          # so wrangler cannot infer it.
          command: pages deploy dist --project-name=pobr-web --branch=master
