# Monthly, grouped updates: one pull request per ecosystem. A Cargo, toolchain
# or Actions change needs the full gate before merging (`mise run ci <ref>`).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    groups:
      web:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /pipeline
    schedule:
      interval: monthly
    groups:
      pipeline:
        patterns: ["*"]
