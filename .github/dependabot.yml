# Grouped updates: Actions daily, package/toolchains monthly. A Cargo, toolchain
# or Actions PR gets all quick checks; risky batches can request pre-merge full CI.
# Master code changes and release tags always run full integration.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    groups:
      web:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /pipeline
    schedule:
      interval: monthly
    groups:
      pipeline:
        patterns: ["*"]
