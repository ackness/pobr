[package]
name = "pobr-wasm"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pobr-core.workspace = true
pobr-tree.workspace = true
pobr-build.workspace = true
pobr-item.workspace = true
pobr-data.workspace = true
pobr-gamedata.workspace = true
pobr-i18n.workspace = true
serde.workspace = true
serde_json.workspace = true

# wasm-bindgen 绑定仅在 wasm feature 下启用，保证宿主 `cargo build` 不需 wasm 工具链。
wasm-bindgen = { version = "0.2", optional = true }

[dev-dependencies]
# Host-only contract generation; never linked into the shipped WASM engine.
ts-rs = "=12.0.1"

[features]
default = []
wasm = ["dep:wasm-bindgen"]
# Manual timing probes and fixture generators do not belong to the default gate.
diagnostics = []

[[test]]
name = "config_context_timing"
required-features = ["diagnostics"]

[[test]]
name = "perf_phases"
required-features = ["diagnostics"]

[[test]]
name = "perf_timing"
required-features = ["diagnostics"]

[[test]]
name = "perf_uncached"
required-features = ["diagnostics"]

[[test]]
name = "perf_corpus"
required-features = ["diagnostics"]

[[test]]
name = "zh_gap_probe"
required-features = ["diagnostics"]

[[test]]
name = "gen_fixtures"
required-features = ["diagnostics"]
