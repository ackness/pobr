[workspace]
members = [
    "crates/pobr-data",
    "crates/pobr-core",
    "tools/sync-pob-catalog",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
pobr-data = { path = "crates/pobr-data" }
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
