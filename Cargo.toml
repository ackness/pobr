[workspace]
members = [
    "crates/pobr-data",
    "crates/pobr-core",
    "crates/pobr-gamedata",
    # 占位骨架（尚未实现，见 devs/docs/architecture/02-crate-design.md）
    "crates/pobr-i18n",
    "crates/pobr-tree",
    "crates/pobr-item",
    "crates/pobr-build",
    "crates/pobr-trade",
    "apps/pobr-cli",
    "apps/pobr-desktop",
    "apps/pobr-wasm",
    # 工具
    "tools/sync-pob-catalog",
    "tools/pobr-data-adapter",
    "tools/lint-i18n",
    "tools/precompile-mods",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
pobr-data = { path = "crates/pobr-data" }
pobr-core = { path = "crates/pobr-core" }
pobr-gamedata = { path = "crates/pobr-gamedata" }
pobr-i18n = { path = "crates/pobr-i18n" }
pobr-tree = { path = "crates/pobr-tree" }
pobr-item = { path = "crates/pobr-item" }
pobr-build = { path = "crates/pobr-build" }
pobr-trade = { path = "crates/pobr-trade" }
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 削减 debug info 以加速 99 个测试二进制的链接（保留 panic 回溯行号）。
# 需要 lldb 单步调试时临时改回 debug = true。
[profile.dev]
debug = "line-tables-only"
