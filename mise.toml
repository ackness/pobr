# PoBR 开发环境与数据管线（mise-en-place）
#
# 环境：`mise install` 装好钉定的工具链。
# 取数据（一键）：`mise run data:fetch` —— 索引（首次 ~113MB，之后跳过）→ 抽取 .dat 为原始 JSON。
# data:adapt updates base/i18n in a candidate; data:regen regenerates all domains.
# Both validate before publishing. Full regeneration needs vendor + LuaJIT.
#
# All export/adaptation entry points resolve the patch from pipeline/config.json.
# 原始 JSON / 索引缓存均在 pipeline/ 下且 gitignore，不入库；入库的只有 data/<version>/。

[tools]
node = "26"

[tasks."data:version"]
description = "查询 GGG 当前 PoE2 patch 版本号（CDN 版本）"
dir = "pipeline"
run = "node query-patch-version.mjs"

[tasks."data:index"]
description = "弹性分块下载 bundle 索引到缓存（规避大文件单流中断；已缓存则跳过）"
dir = "pipeline"
run = "node download-index.mjs"

[tasks."data:export"]
description = "从 GGG CDN 抽取 .dat 表为原始 JSON（→ pipeline/tables/，gitignore）"
dir = "pipeline"
run = "bash export-tables.sh"

[tasks."data:fetch"]
description = "一键取数：索引 → 抽取（原始 JSON）"
dir = "pipeline"
run = ["node download-index.mjs", "bash export-tables.sh"]

[tasks."data:adapt"]
description = "按 config patch 在候选目录适配 base/i18n，完整验证后发布"
run = "python3 pipeline/data_snapshot.py adapt"

[tasks."data:regen"]
description = "候选目录完整再生成、审计、验证后发布（需 vendor 检出 + luajit）"
run = "bash pipeline/regen-all.sh"

[tasks."data"]
description = "取数 + 候选快照完整再生成、验证后发布"
dir = "pipeline"
run = ["node download-index.mjs", "bash export-tables.sh", "cd .. && bash pipeline/regen-all.sh"]
