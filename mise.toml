# PoBR 开发环境与数据管线（mise-en-place）
#
# 环境：`mise install` 装好钉定的工具链。
# 取数据（一键）：`mise run data:fetch` —— 索引（首次 ~113MB，之后跳过）→ 抽取 .dat 为原始 JSON。
# 基础适配：`mise run data:adapt`（base/ + i18n/）；完整八步再生成（含 overlay/tree/
# generated，需 vendor 检出 + luajit）：`mise run data:regen`（= pipeline/regen-all.sh）。
#
# 补丁版本的单一准源是 pipeline/config.json 的 "patch"（download-index / pathofexile-dat /
# regen-all 都读它）；data:adapt 里的 --patch 须与其一致（版本升级 drill 的清单项）。
# 原始 JSON / 索引缓存均在 pipeline/ 下且 gitignore，不入库；入库的只有 data/<version>/。

[tools]
node = "26"

[tasks."data:version"]
description = "查询 GGG 当前 PoE2 patch 版本号（CDN 版本）"
dir = "pipeline"
run = "node query-patch-version.mjs"

[tasks."data:index"]
description = "弹性分块下载 bundle 索引到缓存（规避大文件单流中断；已缓存则跳过）"
dir = "pipeline"
run = "node download-index.mjs"

[tasks."data:export"]
description = "从 GGG CDN 抽取 .dat 表为原始 JSON（→ pipeline/tables/，gitignore）"
dir = "pipeline"
run = "npx -y pathofexile-dat@15"

[tasks."data:fetch"]
description = "一键取数：索引 → 抽取（原始 JSON）"
dir = "pipeline"
run = ["node download-index.mjs", "npx -y pathofexile-dat@15"]

[tasks."data:adapt"]
description = "基础适配：原始 JSON → PoBR 最小 JSON（base/ + i18n/，入库）"
run = "cargo run -p pobr-data-adapter -- --raw pipeline/tables --out data --patch 4.5.4.3"

[tasks."data:regen"]
description = "完整八步再生成 data/<patch>/（含 overlay/tree/generated；需 vendor 检出 + luajit）"
run = "bash pipeline/regen-all.sh"

[tasks."data"]
description = "取数 + 基础适配（完整再生成用 data:regen）"
dir = "pipeline"
run = ["node download-index.mjs", "npx -y pathofexile-dat@15", "cd .. && cargo run -p pobr-data-adapter -- --raw pipeline/tables --out data --patch 4.5.4.3"]
