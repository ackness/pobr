min_version = "2026.10.23"

# PoBR 开发环境与数据管线（mise-en-place）
#
# 环境：`mise run setup` 准备精确工具（Rust 来自 rust-toolchain.toml）、wasm target、wasm-pack、
# Python/Node/pnpm 与 Web/pipeline 依赖；可选工具由对应任务自动准备。
# 取数据（一键）：`mise run data:fetch` —— 索引（首次 ~113MB，之后跳过）→ 抽取 .dat 为原始 JSON。
# data:adapt updates base/i18n in a candidate; data:regen regenerates all domains.
# Both validate before publishing. Full regeneration needs vendor + LuaJIT.
#
# All export/adaptation entry points resolve the patch from pipeline/config.json.
# 原始 JSON / 索引缓存均在 pipeline/ 下且 gitignore，不入库；入库的只有 data/<version>/。

# Rust 版本只在 rust-toolchain.toml 里写一份（本地与 CI 共用）；让 mise 读取它，
# 而不是在这里重复钉一个版本号。
[settings]
idiomatic_version_file_enable_tools = ["rust"]

[tools]
node = "26.13.0"
pnpm = "12.16.1"
# CI 从这里读取同一版本；版本记录在 WASM 构建凭据里，升级属于工具链变更。
"aqua:wasm-bindgen/wasm-pack" = "0.15.1"
python = "3.14.10"
gh = "2.103.3"
actionlint = "1.7.12"

[env]
_.path = ["{{ config_root }}/.cache/runtime/bin"]
POBR_LUAJIT = "{{ config_root }}/.cache/runtime/bin/luajit"
LUA_PATH = "{{ config_root }}/vendor/PathOfBuilding-PoE2/runtime/lua/?.lua;{{ config_root }}/vendor/PathOfBuilding-PoE2/runtime/lua/?/init.lua;;"

[bootstrap.packages]
"apt:git" = { os = "linux" }
"apt:curl" = { os = "linux" }
"apt:ca-certificates" = { os = "linux" }
"apt:build-essential" = { os = "linux" }
"brew:git" = { os = "macos" }

[tasks.setup]
description = "Prepare everyday tools and frozen package dependencies with mise (no product build)"
run = "mise bootstrap --only packages,tools,task"

[tasks."data:version"]
description = "查询 GGG 当前 PoE2 patch 版本号（CDN 版本）"
dir = "pipeline"
run = "node query-patch-version.mjs"

[tasks."data:index"]
description = "弹性分块下载 bundle 索引到缓存（规避大文件单流中断；已缓存则跳过）"
dir = "pipeline"
run = "node download-index.mjs"

[tasks."data:export"]
description = "从 GGG CDN 抽取 .dat 表为原始 JSON（→ pipeline/tables/，gitignore）"
dir = "pipeline"
run = "bash export-tables.sh"

[tasks."data:fetch"]
description = "一键取数：索引 → 抽取（原始 JSON）"
dir = "pipeline"
run = ["node download-index.mjs", "bash export-tables.sh"]

[tasks."data:adapt"]
description = "候选目录适配 base/i18n，运行自有审计与回归后发布；不隐式运行 PoB2"
run = "python3 pipeline/data_snapshot.py adapt"

[tasks."data:adapt:reference"]
depends = ["setup:oracle"]
description = "适配 base/i18n，并显式要求固定 PoB2 parser 对照审计"
run = "python3 pipeline/data_snapshot.py adapt --reference-audit"

[tasks."data:tree:source"]
description = "获取/校验固定官方树输入；--offline 只读哈希缓存，不准备 PoB2"
run = "python3 pipeline/data_snapshot.py fetch-tree-source"

[tasks."data:tree:candidate"]
description = "从固定官方输入独立生成树域候选（--out 必填；不会发布或更新 CURRENT）"
run = "python3 pipeline/data_snapshot.py tree-candidate"

[tasks."data:native:candidate"]
description = "Replay a pinned native recipe with explicit local artifacts and prebuilt adapter; offline, no publication"
run = "python3 pipeline/data_snapshot.py native-candidate"

[tasks."data:client"]
description = "Acquire fixed official-client resources or import archived ranges (explicit source and mode)"
run = "python3 pipeline/client_sources.py"

[tasks."data:client:test"]
description = "Test bounded client resource acquisition with fake HTTP and offline caches"
run = "python3 pipeline/test-client-sources.py"

[tasks."data:client:draft"]
description = "Collect a location-only resource selection into a new unreviewed draft; no promotion"
run = "python3 pipeline/client_source_draft.py"

[tasks."data:client:draft:test"]
description = "Test unreviewed first acquisition with fake HTTP and network-forbidden cache replay"
run = "python3 pipeline/test-client-source-draft.py"

[tasks."data:client:locate"]
description = "Locate explicit resource paths in a fixed client index; emits an unreviewed selection"
run = "python3 pipeline/client_index.py"

[tasks."data:client:locate:test"]
description = "Test bounded index discovery, physical hash vectors and offline replay"
run = "python3 pipeline/test-client-index.py"

[tasks."data:regen"]
depends = ["setup:oracle"]
description = "候选目录完整再生成、审计、验证后发布（需 vendor 检出 + luajit）"
run = "bash pipeline/regen-all.sh"

[tasks."data:bundle"]
description = "Seal version data and shared rules into a new portable bundle (--out required)"
run = "python3 pipeline/data_snapshot.py bundle"

[tasks."data:bundle:verify"]
description = "Verify all bytes and identity of a portable runtime bundle (--bundle required)"
run = "python3 pipeline/data_snapshot.py verify-bundle"

[tasks."data"]
depends = ["setup:oracle"]
description = "取数 + 候选快照完整再生成、验证后发布"
dir = "pipeline"
run = ["node download-index.mjs", "bash export-tables.sh", "cd .. && bash pipeline/regen-all.sh"]

# Development commands. These forward to the repository driver script; extra
# arguments after the task name are passed through unchanged. The game CLI
# (`cargo run -p pobr-cli`, binary `pobr`) contains no development commands.

[tasks.targets]
description = "List Rust crates and test suites without compiling"
run = "bash devs/scripts/driver.sh targets"

[tasks.test]
description = "Run selected tests: `mise run test build skills [filter]` or raw Cargo arguments"
run = "bash devs/scripts/driver.sh test"

[tasks.lint]
description = "fmt check plus Clippy for selected targets: `mise run lint build skills`"
run = "bash devs/scripts/driver.sh lint"

[tasks.verify]
description = "Selected tests, then fmt and Clippy: `mise run verify build skills [filter]`"
run = "bash devs/scripts/driver.sh verify"

[tasks.timings]
description = "Compile one suite with Cargo HTML timings: `mise run timings build parity`"
run = "bash devs/scripts/driver.sh timings"

[tasks.diagnose]
description = "One build's dropped inputs and reference differences: `mise run diagnose <build dir | code file | name>`"
run = "bash devs/scripts/driver.sh diagnose"

[tasks.compare]
depends = ["setup:oracle"]
description = "One build against the pinned PoB2, stat by stat: `mise run compare <build dir | code file | name> [Stat ...]` (needs `mise run vendor` and LuaJIT)"
run = "bash devs/scripts/driver.sh compare"

[tasks.triage]
depends = ["setup:oracle"]
description = "Every worked build against its reference and the pinned PoB2 at once, differences gathered across builds: `mise run triage [set dir | build dir ...]` (needs `mise run vendor` and LuaJIT)"
run = "bash devs/scripts/driver.sh triage"

[tasks.lookup]
description = "The game data records of an id or a name: `mise run lookup <skill id | stat id | base item | passive node | unique> [--level N]`"
run = "bash devs/scripts/driver.sh lookup"

[tasks.gaps]
description = "Rank game-text gaps by worked builds and player sources: `mise run gaps [--json FILE] [--limit N] [--kind unique|passive|mods|...]`"
run = "bash devs/scripts/driver.sh gaps"

[tasks.gap]
description = "Research one game line: `mise run gap \"<template or text>\"` (stats, full sources, build ledger, nearby engine rules)"
run = "bash devs/scripts/driver.sh gap"

[tasks."config:coverage"]
description = "Config readers across benchmark + tuned builds, registered handlers and remaining gaps: `mise run config:coverage [--json FILE]`"
run = "python3 devs/scripts/config-coverage.py"

[tasks."skills:sweep"]
depends = ["setup:oracle"]
description = "Every primary player active skill in a synthetic build against the pinned PoB2: `mise run skills:sweep [--jobs 4] [--refresh]`"
run = "bash devs/scripts/driver.sh skills:sweep"

[tasks.accuracy]
description = "Build codes against the reference values they carry: totals of every committed set, or `mise run accuracy <dir>` for one set's differences"
run = "bash devs/scripts/driver.sh accuracy"

[tasks."builds:fetch"]
description = "One poe.ninja build per ascendancy into a reference set: `mise run builds:fetch <set dir> [--pick first|last]`"
run = "python3 devs/scripts/fetch-reference-builds.py"

[tasks.build]
description = "Build the game CLI, or forward explicit Cargo selectors"
run = "bash devs/scripts/driver.sh build"

[tasks.smoke]
description = "Representative aggregation, parser and Build Code checks"
run = "bash devs/scripts/driver.sh smoke"

[tasks.full]
description = "Explicit full local Rust gate: fmt, Clippy, workspace tests, doctests, i18n"
run = "bash devs/scripts/driver.sh full"

[tasks.gate]
description = "Optional local batch validation on a warm checkout; remote full CI is preferred. Includes fmt, regen drift, Clippy, tests, parity, Web and accuracy (`--only step,...` reruns failures)"
run = "bash devs/scripts/driver.sh gate"

[tasks.regen]
description = "Regenerate parser artifacts (precompile-mods --report) and test the generator"
run = "bash devs/scripts/driver.sh regen"

[tasks.warm]
description = "Copy-on-write clone of another worktree's target/debug into this new worktree: `mise run warm [source worktree]`"
run = "bash devs/scripts/driver.sh warm"

[tasks.cache]
description = "Read-only report of cache sizes and file counts"
run = "bash devs/scripts/driver.sh cache"

[tasks.ci]
description = "Request full cloud CI for a pushed ref: `mise run ci <ref> [--e2e]`"
run = "bash devs/scripts/driver.sh ci"

[tasks."ci-status"]
description = "List cloud CI results: `mise run ci-status [--branch <branch>]`"
run = "bash devs/scripts/driver.sh ci-status"

[tasks.status]
description = "Report toolchain, vendor and data readiness"
run = "bash devs/scripts/driver.sh status"

[tasks.deps]
description = "Install/cache the compatible PoB2 LuaJIT runtime (requires Git, make and a C compiler)"
run = "bash devs/scripts/driver.sh deps"

[tasks.vendor]
description = "Clone or align the pinned PoB2 vendor checkout"
run = "bash devs/scripts/driver.sh vendor"

[tasks.bootstrap]
description = "Finish mise bootstrap: verify tools and install frozen Web/pipeline dependencies; no product build"
run = "bash devs/scripts/setup-environment.sh"

[tasks.drill]
description = "Version-bump drill: data regeneration, compile and parity"
run = "bash devs/scripts/driver.sh drill"

[tasks.versions]
description = "List committed data versions and run the version-independence smoke"
run = "bash devs/scripts/driver.sh versions"

[tasks."data:status"]
description = "Check the committed data snapshot and explain regeneration"
run = "bash devs/scripts/driver.sh data"

[tasks."data:prune"]
description = "Keep the active data version plus the two most recently added: `mise run data:prune [-- --apply]`"
run = "python3 pipeline/prune-data.py"

[tasks."data:diff"]
description = "Diff two committed data versions: `mise run data:diff <verA> <verB> [--domain ...]`"
run = "bash devs/scripts/driver.sh diff"

[tasks."vendor:lua"]
description = "Search the vendored PoB2 Lua for a pattern"
run = "bash devs/scripts/driver.sh lua"

[tasks."check:workflows"]
description = "Check CI syntax, routing, merge preflight, release policy and automation scripts without compiling Rust"
run = "bash devs/scripts/check-workflows.sh"

[tasks.pr-ready]
description = "Optional read-only PR preflight: current head/base, checks and mergeability"
run = "python3 devs/scripts/pr-ready.py"

[tasks.web]
description = "Run a web package command under the project environment: mise run web <command> [args]"
run = "pnpm --dir web"

[tasks.pipeline]
description = "Run a pipeline package command under the project environment"
run = "pnpm --dir pipeline"

[tasks."setup:e2e"]
description = "Install the locked Playwright browser and required OS libraries (explicit opt-in)"
run = ["pnpm --dir web install --frozen-lockfile", "pnpm --dir web exec playwright install --with-deps chromium"]

[tasks."web:e2e"]
description = "Run Playwright with automatically prepared browser dependencies; requires current dist/WASM/data"
depends = ["setup:e2e"]
run = "pnpm --dir web exec playwright test"

[tasks."web:tree-art"]
description = "Regenerate tree artwork with automatically installed, pinned ImageMagick 7 and zstd"
tools = { "conda:imagemagick" = "7.1.2_31", "conda:zstd" = "1.5.7" }
depends = ["vendor"]
run = "pnpm --dir web build-tree-art"

[tasks."setup:oracle"]
description = "Prepare the pinned LuaJIT and PoB2 reference automatically for oracle/data-generation tasks"
run = [
  "bash devs/scripts/driver.sh deps",
  "bash devs/scripts/driver.sh vendor",
  "luajit -e 'local n = 1; n += 1; assert(n == 2); assert(require(\"dkjson\"))'",
]
