[package]
name = "pobr-data-adapter"
version.workspace = true
edition.workspace = true

[dependencies]
pobr-data.workspace = true
serde.workspace = true
# Raw PSG coordinates must round-trip exactly; the default parser can shift one ULP.
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2 = { version = "0.11", default-features = false }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# Safe directory-relative syscalls keep native candidate writes on verified handles.
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
pobr-tree.workspace = true
